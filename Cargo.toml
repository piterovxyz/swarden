[package]
name = "swarden"
version = "0.4.2"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
mime_guess = "2.0.5"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "^2.0"
tokio = { version = "1.53.3", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["cors"] }

[profile.release]
strip = true
