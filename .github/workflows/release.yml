name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build UI
        working-directory: ui
        run: |
          bun i
          bun run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install ARM64 linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Run tests
        run: cargo test --locked

      - name: Build release binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          mkdir -p release
          cargo build --locked --release --target x86_64-unknown-linux-gnu
          cargo build --locked --release --target aarch64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/release/swarden release/swarden-linux-amd64
          cp target/aarch64-unknown-linux-gnu/release/swarden release/swarden-linux-arm64
          cd release && sha256sum swarden-linux-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/swarden-linux-amd64
            release/swarden-linux-arm64
            release/checksums.txt
          generate_release_notes: true
