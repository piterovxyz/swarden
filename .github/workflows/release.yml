name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: run tests
        run: go test -race ./...

      - name: build release binaries
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          mkdir -p release
          GOARCH=amd64 go build -ldflags="-s -w -buildid=" -trimpath -o release/swarden-linux-amd64 ./cmd/swarden &
          GOARCH=arm64 go build -ldflags="-s -w -buildid=" -trimpath -o release/swarden-linux-arm64 ./cmd/swarden &
          wait
          cd release && sha256sum swarden-linux-* > checksums.txt

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/swarden-linux-amd64
            release/swarden-linux-arm64
            release/checksums.txt
          generate_release_notes: true
