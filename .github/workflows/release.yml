name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/piterovxyz/swarden

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: run lint
        run: bun run lint

      - name: run typecheck
        run: bun run typecheck

      - name: run tests
        run: bun test

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: prepare release files
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          sed "s|${IMAGE}:latest|${IMAGE}:${VERSION}|" compose.yml > release/compose.yml
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/compose.yml
          generate_release_notes: true
          body: |
            installation:

            ```sh
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/compose.yml
            docker compose -f compose.yml up -d
            ```

            image: `${{ env.IMAGE }}:${{ steps.version.outputs.version }}`
