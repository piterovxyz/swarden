name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/piterovxyz/swarden
  IMAGE_WEB: ghcr.io/piterovxyz/swarden-web

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: run lint
        run: npm run lint

      - name: run typecheck
        run: npm run typecheck

      - name: run tests
        run: npm test

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: docker metadata (server)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: docker metadata (web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_WEB }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          sbom: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: prepare release files
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          sed -e "s|${IMAGE}:latest|${IMAGE}:${VERSION}|" -e "s|${IMAGE_WEB}:latest|${IMAGE_WEB}:${VERSION}|" -e '/^    build:/,/^      target:/d' compose.yml > release/compose.yml
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/compose.yml
          generate_release_notes: true
          body: |
            installation:

            ```sh
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/compose.yml
            docker compose -f compose.yml up -d
            ```

            images:

            - `${{ env.IMAGE }}:${{ steps.version.outputs.version }}`
            - `${{ env.IMAGE_WEB }}:${{ steps.version.outputs.version }}`
